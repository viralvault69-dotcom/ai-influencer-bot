name: AI Influencer Daily Auto-Post
on:
  schedule:
    - cron: '30 3 * * *'
    - cron: '30 8 * * *'
    - cron: '30 13 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-influencer-slot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
